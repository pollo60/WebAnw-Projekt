      /**
       * Wandelt eine Komma-separierte Zeichenkette in ein Array von Zahlen um.
       * Beispiel: "1.0, 2.3, 1,7" → [1.0, 2.3, 1.7]
       */
      function parseGrades(input) {
        if (!input) return [];
        return input.split(',')                    // Teile bei jedem Komma
          .map(s => s.trim())                      // Entferne Leerzeichen
          .filter(s => s.length > 0)               // Ignoriere leere Strings
          .map(s => s.replace(',', '.'))           // Ersetze Komma durch Punkt
          .map(Number)                              // Wandle in Zahlen um
          .filter(n => Number.isFinite(n));        // Nur gültige Zahlen
      }
